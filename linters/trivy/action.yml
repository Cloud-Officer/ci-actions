---
name: 'Trivy'
description: 'Execute trivy'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Check if TRIVY is enabled
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" TRIVY

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    - name: Detect Trivy scanners
      id: scanners
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/detect_trivy_scanners.sh"

    # Install Trivy from deb repository (aquasecurity/trivy-repo)
    # setup-trivy cannot be used because aquasecurity/trivy repo was wiped on 2026-03-01
    - name: Install Trivy
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      run: |
        sudo apt-get -o Acquire::Retries=5 install -y wget apt-transport-https gnupg
        wget -q --tries=5 --waitretry=5 --retry-connrefused -O - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        # Derive the codename from the runner rather than hardcoding it. It is a
        # property of the runner image, not of this repository, and GitHub rolls
        # ubuntu-latest forward roughly every two years -- 26.04 already exists as
        # ubuntu-26.04. A stale codename here breaks apt-get for every consumer at
        # once, and Trivy is the security gate they all run through.
        #
        # trivy-repo publishes every Ubuntu LTS codename (focal, jammy, noble,
        # resolute), which is all ubuntu-latest ever resolves to, but its interim
        # coverage has gaps (plucky/25.04 is absent). Verify before writing the
        # source so a consumer pinning an unusual image degrades to a working
        # release instead of failing on apt-get update. CFG-003.
        . /etc/os-release
        codename="${VERSION_CODENAME:-noble}"

        if ! wget -q --tries=5 --waitretry=5 --retry-connrefused --spider "https://aquasecurity.github.io/trivy-repo/deb/dists/${codename}/Release"; then
          echo "::warning::trivy-repo has no dist for '${codename}'; falling back to noble"
          codename=noble
        fi

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb ${codename} main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install -y trivy

    - name: Get current date
      id: date
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      run: echo "date=$(date +'%Y-%m-%d')" >> "${GITHUB_OUTPUT}"

    # https://github.com/marketplace/actions/cache
    - name: Cache - Trivy DB
      uses: actions/cache@v6
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        path: ${{ github.workspace }}/.cache/trivy
        key: cache-trivy-${{ steps.date.outputs.date }}
        restore-keys: cache-trivy-

    # https://github.com/aquasecurity/trivy
    - name: Run Trivy
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        SCANNERS: ${{ steps.scanners.outputs.scanners }}
        TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
      run: trivy fs --scanners "${SCANNERS}" --format table --exit-code 1 .
