---
name: 'Hadolint'
description: 'Execute hadolint'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  reviewdog-token:
    description: >-
      Token reviewdog uses to post review comments. Defaults to the job's own GITHUB_TOKEN,
      which needs only `pull-requests: write` on this repository and expires with the job.
      Kept separate from github-token so a long-lived org PAT -- which github-token carries
      for private submodule checkout -- is never handed to the third-party reviewdog action.
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Check if HADOLINT is enabled
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" HADOLINT

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    - name: Setup Reviewdog
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/install_release_tool.sh" reviewdog "${RUNNER_TEMP}/reviewdog"

    - name: Setup Hadolint
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/install_release_tool.sh" hadolint "${RUNNER_TEMP}/hadolint"

    # https://github.com/hadolint/hadolint
    - name: Run Hadolint with Reviewdog
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.reviewdog-token }}
      run: |
        mapfile -d '' dockerfiles < <(git ls-files -z -- '*Dockerfile*')
        if [ "${#dockerfiles[@]}" -eq 0 ]; then
          echo "No Dockerfiles found to check."
          exit 0
        fi
        hadolint --format checkstyle "${dockerfiles[@]}" \
          | reviewdog -f=checkstyle -name="hadolint" -reporter="github-pr-review" -filter-mode="nofilter" -fail-level="any" -level="info"
