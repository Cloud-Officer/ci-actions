---
name: 'PHPStan'
description: 'Execute phpstan'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  apt-packages:
    description: 'additional apt packages to install'
    required: false
    default: 'none'
  php-version:
    description: 'php version'
    required: false
    default: '8.2'
  php-extensions:
    description: 'php extensions'
    required: false
    default: ''
  php-packages:
    description: 'Apt packages installed with PHP from the Ubuntu archive instead of shivammathur/setup-php (see setup); php-extensions is then ignored'
    required: false
    default: ''
  php-apt-repository:
    description: 'S3 apt repository read when php-packages is set'
    required: false
    default: 's3://ugm-builds/apt'
  php-apt-key:
    description: 'S3 location of the ASCII-armored public key that signs php-apt-repository'
    required: false
    default: 's3://ugm-builds/apt/ugroupmedia-apt.asc'
  aws-region:
    description: 'AWS region, used with php-packages'
    required: false
  aws-role-to-assume:
    description: 'IAM role assumed through GitHub OIDC to read php-apt-repository'
    required: false
  aws-access-key-id:
    description: 'AWS access key ID to read php-apt-repository, when no role is set'
    required: false
  aws-secret-access-key:
    description: 'AWS secret access key, required with aws-access-key-id'
    required: false
  composer-command:
    description: 'composer command'
    required: false
    default: 'composer install'
  php-stan-command:
    description: 'php stan command(s)'
    required: false
    default: './vendor/bin/phpstan analyse'

runs:
  using: "composite"
  steps:
    - name: Check if PHPStan is enabled
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" PHPSTAN

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    # https://github.com/marketplace/actions/webfactory-ssh-agent
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.10.0
      if: ${{ inputs.ssh-key != '' && steps.check.outputs.continue == 'true' }}
      with:
        ssh-private-key: ${{ inputs.ssh-key }}

    # install apt packages
    - name: Install APT Packages
      shell: bash
      if: ${{ inputs.apt-packages != 'none' && steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/apt_install.sh"

    # https://github.com/marketplace/actions/configure-aws-credentials-action-for-github-actions
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      if: ${{ inputs.php-packages != '' && steps.check.outputs.continue == 'true' }}
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}

    - name: Setup PHP (apt)
      id: php-apt
      shell: bash
      if: ${{ inputs.php-packages != '' && steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PHP_VERSION: ${{ inputs.php-version }}
        PHP_PACKAGES: ${{ inputs.php-packages }}
        PHP_TOOLS: composer
        PHP_APT_REPOSITORY: ${{ inputs.php-apt-repository }}
        PHP_APT_KEY: ${{ inputs.php-apt-key }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/php_apt_install.sh"

    # https://github.com/marketplace/actions/setup-php-action
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      if: ${{ steps.php-apt.outputs.installed != 'true' && steps.check.outputs.continue == 'true' }}
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}
        tools: composer

    # https://github.com/marketplace/actions/cache
    - name: Cache - Composer Location
      id: composer-cache
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      if: ${{ inputs.php-version != 'none' && steps.check.outputs.continue == 'true' }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/composer_cache_dir.sh"
    - name: Cache - Composer
      uses: actions/cache@v6
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    # COMPOSER_AUTH rather than `composer config --global --auth`: composer reads it
    # natively and takes the same authenticated github-oauth path (so the API rate
    # limit and private-package access are unchanged), but the credential stays scoped
    # to this step. The global form writes the token in cleartext to
    # $COMPOSER_HOME/auth.json, where it outlives the step and is readable by every
    # later step in the job -- third-party actions and dependency lifecycle scripts
    # included -- since all steps run as the same runner user.
    - name: Run Composer
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ inputs.github-token }}"}}'
        COMPOSER_COMMAND: ${{ inputs.composer-command }}
      run: bash -eo pipefail -c -- "${COMPOSER_COMMAND}"

    # https://phpstan.org/
    - name: Run PHPStan
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PHPSTAN_COMMAND: ${{ inputs.php-stan-command }}
      run: bash -eo pipefail -c -- "${PHPSTAN_COMMAND}"
