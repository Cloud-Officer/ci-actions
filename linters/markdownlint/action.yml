---
name: 'Markdownlint'
description: 'Execute markdownlint'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  reviewdog-token:
    description: >-
      Token reviewdog uses to post review comments. Defaults to the job's own GITHUB_TOKEN,
      which needs only `pull-requests: write` on this repository and expires with the job.
      Kept separate from github-token so a long-lived org PAT -- which github-token carries
      for private submodule checkout -- is never handed to the third-party reviewdog action.
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Check if MARKDOWNLINT is enabled
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" MARKDOWNLINT

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    - name: Remove vendor, node_modules, Libraries
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      if: ${{ steps.check.outputs.continue == 'true' }}
      # Drops submodule checkouts (except the shared `scripts` submodule, whose
      # linters/ folder the root config symlinks point at) plus vendored trees.
      # See linters/_lib/clean_workspace.sh for the full rationale.
      run: bash "${GITHUB_ACTION_PATH}/../_lib/clean_workspace.sh" vendor node_modules Libraries

    # https://github.com/marketplace/actions/setup-reviewdog
    - name: Setup Reviewdog
      uses: reviewdog/action-setup@v1
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        reviewdog_version: latest  # Intentionally using latest

    # https://github.com/marketplace/actions/setup-node-js-environment
    - name: Setup Node
      uses: actions/setup-node@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        node-version: latest  # Intentionally using latest to always use newest Node.js

    - name: Install markdownlint-cli2
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      if: ${{ steps.check.outputs.continue == 'true' }}
      run: |
        npm install -g markdownlint-cli2

    - name: Run markdownlint
      shell: bash
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.reviewdog-token }}
      if: ${{ steps.check.outputs.continue == 'true' }}
      run: |
        markdownlint-cli2 "**/*.md" 2>&1 | reviewdog -efm="%f:%l:%c %m" -efm="%f:%l %m" -name="markdownlint" -reporter="github-pr-review" -filter-mode="nofilter" -fail-level="any" -level="info"
