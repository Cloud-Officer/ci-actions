---
name: 'ESLint'
description: 'Execute eslint'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  reviewdog-token:
    description: >-
      Token reviewdog uses to post review comments. Defaults to the job's own GITHUB_TOKEN,
      which needs only `pull-requests: write` on this repository and expires with the job.
      Kept separate from github-token so a long-lived org PAT -- which github-token carries
      for private submodule checkout -- is never handed to the third-party reviewdog action.
    required: false
    default: ${{ github.token }}
  eslint-version:
    description: 'ESLint version to install. Pinned to v8.x by default - v9 (flat config) is incompatible with legacy frontend JS (jQuery, etc.)'
    required: false
    default: '8.57.0'

runs:
  using: "composite"
  steps:
    - id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" ESLINT

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    # https://github.com/marketplace/actions/setup-node-js-environment
    - name: Setup Node
      uses: actions/setup-node@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        node-version: latest  # Intentionally using latest to always use newest Node.js

    - name: Install ESLint
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ESLINT_VERSION: ${{ inputs.eslint-version }}
      if: ${{ steps.check.outputs.continue == 'true' }}
      run: npm install --fetch-retries=5 "eslint@${ESLINT_VERSION}"

    - name: Setup Reviewdog
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/install_release_tool.sh" reviewdog "${RUNNER_TEMP}/reviewdog"

    # https://github.com/eslint/eslint
    - name: Run ESLint with Reviewdog
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.reviewdog-token }}
      run: |
        npx --no-install eslint . \
          | reviewdog -f=eslint -name="eslint" -reporter="github-pr-review" -filter-mode="nofilter" -fail-level="any" -level="info"
