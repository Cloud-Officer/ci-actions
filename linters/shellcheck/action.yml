---
name: 'ShellCheck'
description: 'Execute shellcheck'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  reviewdog-token:
    description: >-
      Token reviewdog uses to post review comments. Defaults to the job's own GITHUB_TOKEN,
      which needs only `pull-requests: write` on this repository and expires with the job.
      Kept separate from github-token so a long-lived org PAT -- which github-token carries
      for private submodule checkout -- is never handed to the third-party reviewdog action.
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Check if SHELLCHECK is enabled
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" SHELLCHECK

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    # https://github.com/marketplace/actions/run-shellcheck-with-reviewdog
    - name: Run Shellcheck with Reviewdog
      uses: reviewdog/action-shellcheck@v1
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        # *.bats excluded explicitly: a bats suite is not shell (its @test syntax
        # does not parse) and the upstream shebang scan below would otherwise pick
        # up any suite whose interpreter line happens to mention a shell.
        exclude: "./.git/*:./.vendor/*:./vendor/*:./node_modules/*:./Libraries/*:./Pods/*:*.bats"
        fail_level: any
        filter_mode: nofilter
        github_token: ${{ inputs.reviewdog-token }}
        level: info
        path: "."
        pattern: "*.sh"
        # Shell tools installed onto PATH carry no extension (linters, ssm-jump,
        # generate-codeowners), so `pattern` alone never sees them. This makes the
        # action additionally scan files whose first line is a shell shebang, which
        # is the same basis github-build uses to decide whether to enable ShellCheck
        # for the repository at all (config/linters.yaml -> shellcheck.shebang_match).
        #
        # The two regexes are not identical: upstream matches `^#!.*sh`, which is
        # looser than github-build's `[/ ](ba|da|k)?sh([[:space:]]|$)` and so also
        # matches zsh and fish -- dialects ShellCheck rejects with SC1071. That only
        # bites a repository that actually ships one, and none do today; add the
        # offending path to `exclude` above if that changes.
        check_all_files_with_shebangs: "true"
        reporter: github-pr-review
        # https://github.com/koalaman/shellcheck
        shellcheck_flags: --external-sources
