---
name: 'Flake8'
description: 'Execute flake8'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  reviewdog-token:
    description: >-
      Token reviewdog uses to post review comments. Defaults to the job's own GITHUB_TOKEN,
      which needs only `pull-requests: write` on this repository and expires with the job.
      Kept separate from github-token so a long-lived org PAT -- which github-token carries
      for private submodule checkout -- is never handed to the third-party reviewdog action.
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Check if FLAKE8 is enabled
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" FLAKE8

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    # https://github.com/marketplace/actions/setup-reviewdog
    - name: Setup Reviewdog
      uses: reviewdog/action-setup@v1
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        reviewdog_version: latest  # Intentionally using latest

    # flake8-docstrings supplies the D* (pydocstyle) codes that .flake8 has always
    # listed in its ignore set but that were never actually emitted, because the
    # plugin was not installed. Enabling it is paired with adding D100-D107 to that
    # ignore list: those are the "missing docstring" family, and requiring a docstring
    # on every module, class, method and function across every consumer repo is a
    # documentation policy decision, not a lint fix. Measured over the five Python
    # repos in the org, the pair leaves 16 real findings (D209/D301) instead of 825.
    - name: Install flake8
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      if: ${{ steps.check.outputs.continue == 'true' }}
      run: |
        sudo rm -f /usr/lib/python3*/EXTERNALLY-MANAGED
        pip install --upgrade flake8 flake8-docstrings
    - name: Run flake8
      shell: bash
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.reviewdog-token }}
      if: ${{ steps.check.outputs.continue == 'true' }}
      run: flake8 . 2>&1 | reviewdog -f=flake8 -name=flake8 -reporter=github-pr-review -filter-mode=nofilter -fail-level=any -level=info
