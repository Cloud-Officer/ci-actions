---
name: 'Flake8'
description: 'Execute flake8'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Check if FLAKE8 is enabled
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" FLAKE8

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    # https://github.com/marketplace/actions/setup-reviewdog
    - name: Setup Reviewdog
      uses: reviewdog/action-setup@v1
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        reviewdog_version: latest  # Intentionally using latest

    # Installs flake8 only. The step used to be named "Install flake8-docstrings"
    # while installing plain flake8, so the name described behaviour it did not have.
    #
    # Note for whoever revisits this: .flake8 ignores D200/D202/D204/D205/D210/D400/
    # D401/D403, which are flake8-docstrings (pydocstyle) codes, so the plugin was
    # clearly intended at some point. Those ignores are inert today -- without the
    # plugin no D code is ever emitted. Adding `flake8-docstrings` here is a
    # deliberate, breaking decision, not a cleanup: the codes NOT in that ignore list
    # (D100-D107 "missing docstring" in particular) would start failing every
    # consumer repo's Python lint on the next run. Enable it on purpose or not at all.
    - name: Install flake8
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      if: ${{ steps.check.outputs.continue == 'true' }}
      run: |
        sudo rm -f /usr/lib/python3*/EXTERNALLY-MANAGED
        pip install --upgrade flake8
    - name: Run flake8
      shell: bash
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
      if: ${{ steps.check.outputs.continue == 'true' }}
      run: flake8 . 2>&1 | reviewdog -f=flake8 -name=flake8 -reporter=github-pr-review -filter-mode=nofilter -fail-level=any -level=info
