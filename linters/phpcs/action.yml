---
name: 'PHPCS'
description: 'Execute php-cs-fixer'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  php-version:
    description: 'php version'
    required: false
    default: '8.2'
  php-extensions:
    description: 'php extensions'
    required: false
    default: ''
  composer-command:
    description: 'composer command'
    required: false
    default: 'none'
  php-cs-fixer-version:
    description: 'php-cs-fixer version'
    required: false
    default: 'latest'  # Intentionally using latest
  php-cs-fixer-command:
    description: 'php-cs-fixer command(s)'
    required: false
    default: './php-cs-fixer fix --dry-run --diff --verbose'

runs:
  using: "composite"
  steps:
    - name: Check if PHPCS is enabled
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" PHPCS

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    # https://github.com/marketplace/actions/webfactory-ssh-agent
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.10.0
      if: ${{ inputs.ssh-key != '' && steps.check.outputs.continue == 'true' && inputs.composer-command != 'none' }}
      with:
        ssh-private-key: ${{ inputs.ssh-key }}

    # https://github.com/marketplace/actions/setup-php-action
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}
        tools: composer

    - name: Setup php-cs-fixer
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' && inputs.composer-command == 'none'}}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PHP_CS_FIXER_VERSION: ${{ inputs.php-cs-fixer-version }}
      run: |
        # Full 40-character fingerprint, not the 64-bit long ID. Keyservers are
        # unauthenticated and serve any uploaded key matching the requested ID, and
        # a colliding long ID is computable -- so requesting by long ID lets an
        # attacker's key satisfy the `gpg --verify` below. Matches the form
        # linters/pmd/action.yml already uses.
        # BBAB5DF0A0D6672989CF1869E82B2FB314E9906E = Dariusz Ruminski (php-cs-fixer).
        bash "${GITHUB_ACTION_PATH}/../_lib/recv_gpg_key.sh" BBAB5DF0A0D6672989CF1869E82B2FB314E9906E
        if [ "${PHP_CS_FIXER_VERSION}" == "latest" ] ;then
          curl -L https://cs.symfony.com/download/php-cs-fixer-v3.phar -o php-cs-fixer
          curl -L https://cs.symfony.com/download/php-cs-fixer-v3.phar.asc -o php-cs-fixer.asc
        else
          curl -L "https://github.com/FriendsOfPHP/PHP-CS-Fixer/releases/download/${PHP_CS_FIXER_VERSION}/php-cs-fixer.phar" -o php-cs-fixer
          curl -L "https://github.com/FriendsOfPHP/PHP-CS-Fixer/releases/download/${PHP_CS_FIXER_VERSION}/php-cs-fixer.phar.asc" -o php-cs-fixer.asc
        fi
        gpg --verify php-cs-fixer.asc php-cs-fixer
        rm -f php-cs-fixer.asc
        chmod a+x php-cs-fixer

    # https://github.com/marketplace/actions/cache
    - name: Cache - Composer Location
      id: composer-cache
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      if: ${{ steps.check.outputs.continue == 'true' && inputs.composer-command != 'none' }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/composer_cache_dir.sh"
    - name: Cache - Composer
      uses: actions/cache@v6
      if: ${{ steps.check.outputs.continue == 'true' && inputs.composer-command != 'none' }}
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Run Composer
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' && inputs.composer-command != 'none'}}
      env:
        COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ inputs.github-token }}"}}'
        COMPOSER_COMMAND: ${{ inputs.composer-command }}
      run: bash -eo pipefail -c -- "${COMPOSER_COMMAND}"

    # https://cs.symfony.com/doc/usage.html
    - name: Run php-cs-fixer
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PHP_CS_FIXER_COMMAND: ${{ inputs.php-cs-fixer-command }}
      run: |
        if [ ! -e ./php-cs-fixer ] && [ -x ./vendor/bin/php-cs-fixer ]; then
          ln -s ./vendor/bin/php-cs-fixer ./php-cs-fixer
        fi
        bash -eo pipefail -c -- "${PHP_CS_FIXER_COMMAND}"
