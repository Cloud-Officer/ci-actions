---
name: 'Actionlint'
description: 'Execute actionlint'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  reviewdog-token:
    description: >-
      Token reviewdog uses to post review comments. Defaults to the job's own GITHUB_TOKEN,
      which needs only `pull-requests: write` on this repository and expires with the job.
      Kept separate from github-token so a long-lived org PAT -- which github-token carries
      for private submodule checkout -- is never handed to the third-party reviewdog action.
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" ACTIONLINT

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    - name: Setup Reviewdog
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/install_release_tool.sh" reviewdog "${RUNNER_TEMP}/reviewdog"

    - name: Setup Actionlint
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/install_release_tool.sh" actionlint "${RUNNER_TEMP}/actionlint"

    - name: Setup ShellCheck
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/install_release_tool.sh" shellcheck "${RUNNER_TEMP}/shellcheck"

    - name: Setup Pyflakes
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: pipx install pyflakes

    # https://github.com/rhysd/actionlint
    - name: Run Actionlint with Reviewdog
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.reviewdog-token }}
      run: |
        actionlint -oneline \
          | reviewdog -efm="%f:%l:%c: %m" -name="actionlint" -reporter="github-pr-review" -filter-mode="nofilter" -fail-level="any" -level="info"
