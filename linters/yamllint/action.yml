---
name: 'Yamllint'
description: 'Execute yamllint'

inputs:
  linters:
    description: 'List of all enabled linters'
    required: true
  ssh-key:
    description: 'ssh key'
    required: true
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  reviewdog-token:
    description: >-
      Token reviewdog uses to post review comments. Defaults to the job's own GITHUB_TOKEN,
      which needs only `pull-requests: write` on this repository and expires with the job.
      Kept separate from github-token so a long-lived org PAT -- which github-token carries
      for private submodule checkout -- is never handed to the third-party reviewdog action.
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Check if YAML Lint is enabled
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LINTERS: ${{ inputs.linters }}
      run: bash "${GITHUB_ACTION_PATH}/../_lib/check_enabled.sh" YAMLLINT

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    - name: Remove submodules
      shell: bash
      if: ${{ steps.check.outputs.continue == 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      # Drops submodule checkouts except the shared `scripts` submodule, whose
      # linters/ folder the root config symlinks point at. See
      # linters/_lib/clean_workspace.sh for the full rationale.
      run: bash "${GITHUB_ACTION_PATH}/../_lib/clean_workspace.sh"

    # https://github.com/marketplace/actions/run-yamllint-with-reviewdog
    - name: Run Yamllint with Reviewdog
      uses: reviewdog/action-yamllint@v1
      if: ${{ steps.check.outputs.continue == 'true' }}
      with:
        fail_level: any
        filter_mode: nofilter
        github_token: ${{ inputs.reviewdog-token }}
        level: info
        reporter: github-pr-review
        # https://yamllint.readthedocs.io/en/stable/
        yamllint_flags: "--strict ."
