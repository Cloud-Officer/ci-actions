---
name: 'DockerHub'
description: 'Build Docker images and optionally publish them to DockerHub'

inputs:
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  username:
    description: 'Username used to log against the Docker registry (required when push is true)'
    required: false
    default: ''
  password:
    description: 'Password or personal access token used to log against the Docker registry (required when push is true)'
    required: false
    default: ''
  push:
    description: 'Publish the image to DockerHub (true) or only build it (false)'
    required: false
    default: 'true'
  platforms:
    description: 'Comma separated list of target platforms'
    required: false
    default: 'linux/amd64,linux/arm64'
  context:
    description: 'Build context'
    required: false
    default: '.'
  file:
    description: 'Path to the Dockerfile'
    required: false
    default: './Dockerfile'

runs:
  using: "composite"
  steps:
    - name: Validate Inputs
      id: validate
      shell: bash
      env:
        PUSH: ${{ inputs.push }}
        PLATFORMS: ${{ inputs.platforms }}
        DOCKER_USERNAME: ${{ inputs.username }}
        DOCKER_PASSWORD: ${{ inputs.password }}
      run: |
        case "${PUSH}" in
          true|false) ;;
          *) echo "::error::push must be 'true' or 'false', got '${PUSH}'"; exit 1 ;;
        esac

        bash "${GITHUB_ACTION_PATH}/../linters/_lib/require_inputs.sh" \
          "platforms=${PLATFORMS}"

        if [ "${PUSH}" = "true" ]; then
          bash "${GITHUB_ACTION_PATH}/../linters/_lib/require_inputs.sh" \
            "username=${DOCKER_USERNAME}" \
            "password=${DOCKER_PASSWORD}"
        fi

        echo "cache-scope=docker-${PLATFORMS//[^A-Za-z0-9]/-}" >> "${GITHUB_OUTPUT}"

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.github-token }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    - name: Get Repository Name
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "${GITHUB_ENV}"

    # https://github.com/marketplace/actions/docker-login
    - name: Log in to Docker Hub
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # https://github.com/marketplace/actions/docker-setup-buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        # Intentionally using latest buildkit for newest features and fixes
        driver-opts: |
          image=moby/buildkit:latest
          network=host

    # https://github.com/marketplace/actions/docker-metadata-action
    - name: Extract Metadata (tags, labels) for Docker
      id: meta
      if: inputs.push == 'true'
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.username }}/${{ env.REPO_NAME }}

    # https://github.com/marketplace/actions/build-and-push-docker-images
    - name: Build and Push Docker Images
      id: push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ steps.validate.outputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ steps.validate.outputs.cache-scope }}

    # https://github.com/marketplace/actions/attest-build-provenance
    - name: Generate Artifact Attestation
      if: inputs.push == 'true'
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: docker.io/${{ inputs.username }}/${{ env.REPO_NAME }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: false
