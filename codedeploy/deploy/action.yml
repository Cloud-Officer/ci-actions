---
name: 'Deploy'
description: 'Deploy to code deploy target group'

inputs:
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  aws-access-key-id:
    description: 'aws access key id; leave empty when aws-role-to-assume is set'
    required: false
  aws-secret-access-key:
    description: 'aws secret access key; leave empty when aws-role-to-assume is set'
    required: false
  aws-region:
    description: 'aws region'
    required: true
  aws-role-to-assume:
    description: 'ARN of the IAM role to assume with GitHub OIDC instead of access keys; the job needs permissions: id-token: write'
    required: false
  aws-audience:
    description: 'audience of the GitHub OIDC token'
    required: false
    default: 'sts.amazonaws.com'
  aws-role-session-name:
    description: 'session name recorded in CloudTrail for the assumed role'
    required: false
    default: 'GitHubActions'
  aws-role-duration-seconds:
    description: 'lifetime of the assumed role credentials, in seconds'
    required: false
    default: '3600'
  application-name:
    description: 'aws deploy application name'
    required: true
  deployment-group-name:
    description: 'aws deploy deployment group name'
    required: true
  s3-bucket:
    description: 'aws deploy s3 bucket'
    required: true
  s3-key:
    description: 'aws deploy s3 key'
    required: true
  deployment-strategy:
    description: 'aws deploy deployment strategy'
    required: false
    default: 'CodeDeployDefault.OneAtATime'
  monitor-timeout-minutes:
    description: 'how long to poll CodeDeploy before failing the step'
    required: false
    default: '30'
runs:
  using: 'composite'
  steps:
    # GitHub Actions does not enforce `required: true` for composite actions, so an
    # unset or misspelled secret reaches the steps below as an empty string. Fail
    # loudly here instead of running nothing and reporting success (CFG-002).
    - name: Validate Inputs
      shell: bash
      env:
        APPLICATION_NAME: ${{ inputs.application-name }}
        DEPLOYMENT_GROUP_NAME: ${{ inputs.deployment-group-name }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_KEY: ${{ inputs.s3-key }}
        REGION: ${{ inputs.aws-region }}
        ROLE_TO_ASSUME: ${{ inputs.aws-role-to-assume }}
        ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../linters/_lib/require_inputs.sh" \
          "application-name=${APPLICATION_NAME}" \
          "deployment-group-name=${DEPLOYMENT_GROUP_NAME}" \
          "s3-bucket=${S3_BUCKET}" \
          "s3-key=${S3_KEY}" \
          "aws-region=${REGION}"
        bash "${GITHUB_ACTION_PATH}/../../linters/_lib/require_aws_credentials.sh"

    # https://github.com/marketplace/actions/configure-aws-credentials-action-for-github-actions
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        audience: ${{ inputs.aws-audience }}
        role-session-name: ${{ inputs.aws-role-session-name }}
        role-duration-seconds: ${{ inputs.aws-role-duration-seconds }}

    - name: Deploy to CodeDeploy
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        APPLICATION_NAME: ${{ inputs.application-name }}
        DEPLOYMENT_GROUP_NAME: ${{ inputs.deployment-group-name }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_KEY: ${{ inputs.s3-key }}
        DEPLOYMENT_STRATEGY: ${{ inputs.deployment-strategy }}
        MONITOR_TIMEOUT_MINUTES: ${{ inputs.monitor-timeout-minutes }}
      run: bash "${GITHUB_ACTION_PATH}/deploy.sh"
