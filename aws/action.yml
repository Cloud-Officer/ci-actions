---
name: 'AWS'
description: 'Execute AWS CLI or shell commands'

inputs:
  github-token:
    description: 'github token'
    required: false
    default: ${{ github.token }}
  ssh-key:
    description: 'ssh key'
    required: true
  aws-access-key-id:
    description: 'aws access key id; leave empty when aws-role-to-assume is set'
    required: false
  aws-secret-access-key:
    description: 'aws secret access key; leave empty when aws-role-to-assume is set'
    required: false
  aws-region:
    description: 'aws region'
    required: true
  aws-role-to-assume:
    description: 'ARN of the IAM role to assume with GitHub OIDC instead of access keys; the job needs permissions: id-token: write'
    required: false
  aws-audience:
    description: 'audience of the GitHub OIDC token'
    required: false
    default: 'sts.amazonaws.com'
  aws-role-session-name:
    description: 'session name recorded in CloudTrail for the assumed role'
    required: false
    default: 'GitHubActions'
  aws-role-duration-seconds:
    description: 'lifetime of the assumed role credentials, in seconds'
    required: false
    default: '3600'
  shell-commands:
    description: 'shell commands'
    required: true
runs:
  using: 'composite'
  steps:
    # GitHub Actions does not enforce `required: true` for composite actions, so an
    # unset or misspelled secret reaches the steps below as an empty string. Fail
    # loudly here instead of running nothing and reporting success (CFG-002).
    - name: Validate Inputs
      shell: bash
      env:
        SHELL_COMMANDS: ${{ inputs.shell-commands }}
        REGION: ${{ inputs.aws-region }}
        ROLE_TO_ASSUME: ${{ inputs.aws-role-to-assume }}
        ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../linters/_lib/require_inputs.sh" \
          "shell-commands=${SHELL_COMMANDS}" \
          "aws-region=${REGION}"
        bash "${GITHUB_ACTION_PATH}/../linters/_lib/require_aws_credentials.sh"

    # https://github.com/marketplace/actions/checkout
    - name: Checkout
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.github-token }}
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        lfs: true
        submodules: recursive

    # https://github.com/marketplace/actions/configure-aws-credentials-action-for-github-actions
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        audience: ${{ inputs.aws-audience }}
        role-session-name: ${{ inputs.aws-role-session-name }}
        role-duration-seconds: ${{ inputs.aws-role-duration-seconds }}

    - name: Run Shell Commands
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SHELL_COMMANDS: ${{ inputs.shell-commands }}
      # -eo pipefail: the composite step's own shell options do NOT propagate
      # into this inner interpreter, so without them only the LAST command's
      # exit status would be reported and earlier failures would be swallowed.
      run: bash -eo pipefail -c -- "${SHELL_COMMANDS}"
